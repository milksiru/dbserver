name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on:
      - self-hosted
      - workstation
      - k8s
      - podman
      - internal-registry
      - dbserver
    env:
      EXTERNAL_IMAGE: timescale/timescaledb:2.27.1-pg16
      INTERNAL_IMAGE: 192.168.55.148:5000/timescale/timescaledb:2.27.1-pg16
      NAMESPACE: apps
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror TimescaleDB image
        run: |
          podman pull "$EXTERNAL_IMAGE"
          podman tag "$EXTERNAL_IMAGE" "$INTERNAL_IMAGE"
          podman push "$INTERNAL_IMAGE"

      - name: Ensure database secret
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic timescaledb-secret \
            --namespace "$NAMESPACE" \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=POSTGRES_DB="$POSTGRES_DB" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Argo CD application
        run: kubectl apply -f deploy/argocd/application.yaml

      - name: Apply manifests
        run: kubectl apply -k deploy/k8s

      - name: Wait for rollout
        run: kubectl -n "$NAMESPACE" rollout status statefulset/timescaledb --timeout=10m
