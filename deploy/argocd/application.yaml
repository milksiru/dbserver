apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dbserver
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: https://github.com/milksiru/dbserver.git
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
